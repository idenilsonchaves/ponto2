{% extends "admin_base.html" %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Auditoria do Sistema</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="window.location.reload()">Atualizar</button>
    </div>
</div>

<div class="table-responsive">
    <table class="table table-striped table-sm" style="font-size: 0.85rem;">
        <thead>
            <tr>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Usuário</th>
                <th>Ação</th>
                <th>Dados</th>
            </tr>
        </thead>
        <tbody>
            {% for aud in auditoria %}
            <tr>
                <td>{{ aud.id }}</td>
                <td style="white-space: nowrap;">{{ aud.ts }}</td>
                <td>{{ aud.usuario }}</td>
                <td>{{ aud.acao }}</td>
                <td style="word-break: break-all;">{{ aud.dados }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}

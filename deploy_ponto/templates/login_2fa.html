<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação em Duas Etapas - Ponto Eletrônico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #f5f5f5;
            height: 100vh;
        }
        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 15px;
            margin: auto;
        }
    </style>
</head>
<body class="text-center">
    <main class="form-signin">
        <form action="/login/2fa" method="post">
            <h1 class="h3 mb-3 fw-normal">Verificação 2FA</h1>
            
            <p class="mb-3">Um código de verificação foi enviado para o console do servidor (Simulação).</p>

            {% if erro %}
            <div class="alert alert-danger">{{ erro }}</div>
            {% endif %}

            <div class="form-floating mb-3">
                <input type="text" name="code" class="form-control" id="floatingInput" placeholder="Código" required autofocus>
                <label for="floatingInput">Código de 6 dígitos</label>
            </div>

            <button class="w-100 btn btn-lg btn-primary" type="submit">Verificar</button>
            <a href="/login" class="mt-3 d-block">Voltar para Login</a>
            <p class="mt-5 mb-3 text-muted">&copy; 2024</p>
        </form>
    </main>
</body>
</html>

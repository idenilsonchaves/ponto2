{% extends "layout.html" %}

{% block content %}
<div class="card card-ponto">
    <div class="card-body text-center p-5">
        {% if cor == 'success' %}
            <i class="bi bi-check-circle-fill text-success" style="font-size: 5rem;"></i>
            <h2 class="mt-3 text-success">Sucesso!</h2>
        {% else %}
            <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 5rem;"></i>
            <h2 class="mt-3 text-danger">Atenção</h2>
        {% endif %}
        
        <p class="lead mt-3">{{ msg }}</p>
        
        <div class="mt-5">
            <a href="/" class="btn btn-primary btn-lg px-5">Voltar</a>
        </div>
        
        <script>
            // Redirecionar automaticamente após 5 segundos
            setTimeout(function() {
                window.location.href = "/";
            }, 5000);
        </script>
    </div>
</div>
{% endblock %}
